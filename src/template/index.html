<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://192.168.1.11:7860/static/css/styles.css" rel="stylesheet">
    <link rel="icon" href="https://192.168.1.11:7860/static/icone/favicon.png" type="image/x-icon" />
    <title>Live Interview</title>
</head>


<body>
    <!-- Add toast element after body opening tag -->
    <div id="error-toast" class="toast"></div>
    <div style="text-align: center">
        <h1 class="center">agent assistant</h1>
    </div>
    <div class="container">
        <div class="controls">
            <div class="input-group">
                <label for="voice">Voice</label>
                <select id="voice">
                    <option value="Zephyr">Zephyr</option>
                    <option value="Charon">Charon</option>
                    <option value="Kore">Kore</option>
                    <option value="Autonoe">Autonoe</option>
                    <option value="Alnilam">Alnilam</option>
                </select>
            </div>
        </div>

        <div class="wave-container">
            <div class="box-container">
                <!-- Boxes will be dynamically added here -->
            </div>
        </div>

        <button id="start-button">Start Recording</button>
    </div>

    <audio id="audio-output"></audio>

    <script src="https://192.168.1.11:7860/static/script/script.js"></script>
</body>

</html>
