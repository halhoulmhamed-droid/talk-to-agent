<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/css/styles.css" rel="stylesheet">
    <link rel="icon" href="/static/icone/favicon.png" type="image/x-icon" />
    <title>Talk-to-Agent — Realtime Voice Demo</title>
</head>


<body>
    <div id="error-toast" class="toast" role="status" aria-live="polite"></div>
    <div style="text-align: center">
        <h1 class="center">Talk-to-Agent</h1>
        <p class="subtitle">Local realtime voice interview demo powered by WebRTC and Gemini Live.</p>
    </div>
    <div class="container">
        <div class="controls">
            <div class="input-group">
                <label for="voice">Gemini voice</label>
                <select id="voice">
                    <option value="Zephyr">Zephyr</option>
                    <option value="Charon">Charon</option>
                    <option value="Kore">Kore</option>
                    <option value="Autonoe">Autonoe</option>
                    <option value="Alnilam">Alnilam</option>
                </select>
            </div>
        </div>

        <div class="wave-container">
            <div class="box-container">
                <!-- Boxes will be dynamically added here -->
            </div>
        </div>

        <button id="start-button" type="button">Start Recording</button>
    </div>

    <audio id="audio-output"></audio>

    <script src="/static/script/script.js"></script>
</body>

</html>
